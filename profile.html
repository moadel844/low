<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ملفي الشخصي | المستشار</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=El+Messiri:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <style>
    .profile-grid { display: grid; grid-template-columns: 350px 1fr; gap: 2rem; margin-top: 2rem; }
    @media (max-width: 900px) { .profile-grid { grid-template-columns: 1fr; } }
    
    /* كارت الـ CV (الشمال) */
    .cv-card { background: var(--surface); border-radius: 20px; border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; text-align: center; padding-bottom: 2rem; position: relative; }
    .cv-header-bg { height: 120px; background: linear-gradient(135deg, var(--indigo-dark), var(--indigo-soft)); }
    .avatar-container { position: relative; width: 130px; height: 130px; margin: -65px auto 1rem; }
    .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid var(--surface); box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: none; }
    .avatar-placeholder { width: 100%; height: 100%; border-radius: 50%; background: var(--brass); color: white; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-family: var(--font-head); border: 4px solid var(--surface); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    
    .avatar-upload-btn { position: absolute; bottom: 5px; right: 5px; background: var(--surface); border: 1px solid var(--line); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.2s; z-index: 10; }
    .avatar-upload-btn:hover { transform: scale(1.1); background: var(--paper); }
    
    .cv-card h2 { margin: 0; font-size: 1.6rem; color: var(--indigo); }
    .cv-card .role-badge { display: inline-block; background: var(--brass-soft); color: var(--brass-deep); padding: 0.3rem 1rem; border-radius: 20px; font-weight: bold; font-size: 0.9rem; margin-top: 0.5rem; }
    .cv-info { text-align: right; padding: 1.5rem; margin-top: 1rem; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 1rem; font-size: 0.95rem; }
    .cv-info div { display: flex; justify-content: space-between; align-items: center; }
    .cv-info strong { color: var(--ink-soft); font-weight: 600; font-size: 0.85rem; }
    
    /* الإحصائيات */
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; padding: 0 1.5rem; margin-top: 1rem; }
    .stat-box { background: var(--paper); border-radius: 12px; padding: 1rem 0.5rem; border: 1px solid var(--line); }
    .stat-box .num { font-size: 1.8rem; font-weight: 700; color: var(--indigo); font-family: var(--font-head); line-height: 1; margin-bottom: 0.3rem; }
    .stat-box .lbl { font-size: 0.75rem; color: var(--ink-soft); font-weight: 600; }
    
    /* التابات (اليمين) */
    .tabs-container { background: var(--surface); border-radius: 20px; border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; }
    .tabs-nav { display: flex; border-bottom: 1px solid var(--line); background: var(--paper); }
    .tab-btn { padding: 1rem 1.5rem; border: none; background: transparent; font-family: inherit; font-weight: 600; color: var(--ink-soft); cursor: pointer; transition: 0.2s; border-bottom: 3px solid transparent; flex: 1; font-size: 1rem; }
    .tab-btn:hover { color: var(--indigo); }
    .tab-btn.active { color: var(--indigo); border-bottom-color: var(--indigo); background: var(--surface); }
    .tab-content { padding: 2rem; display: none; }
    .tab-content.active { display: block; }
    
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }
    .full-width { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">المستشار</div>
      <div class="global-search-wrapper">
        <input type="search" id="global-search-input" placeholder="بحث سريع..." autocomplete="off">
        <div id="global-search-results" class="global-search-results"></div>
      </div>
      <nav class="topnav">
        <a href="index.html"><svg class="ico" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg><span>الرئيسية</span></a>
        <a href="clients.html"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.3 3-5 6-5s5.4 1.7 6 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.2c2.4.2 4 1.7 4.5 4.3"/></svg><span>الموكلين</span></a>
        <a href="cases.html"><svg class="ico" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M10 12h5M10 16h5"/></svg><span>القضايا</span></a>
        <a href="agenda.html"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>الأجندة</span></a>
        <a href="documents.html"><svg class="ico" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg><span>الأرشيف</span></a>
        <a href="reports.html"><svg class="ico" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><span>التقارير</span></a>
        <a id="admin-link" href="admin.html" hidden><svg class="ico" viewBox="0 0 24 24"><path d="M12 3 5 6v5.5c0 4.2 2.9 7.6 7 9.5 4.1-1.9 7-5.3 7-9.5V6l-7-3Z"/><path d="m9 12 2.2 2.2L15.5 10"/></svg><span>المدير</span></a>
      </nav>
      <div class="user-box">
        <button class="theme-toggle" type="button"></button>
        <span id="user-avatar" class="avatar"></span>
        <span id="user-name"></span>
        <span id="user-role" class="role-tag"></span>
        <button id="logout-btn" type="button" class="btn btn-quiet">تسجيل الخروج</button>
      </div>
    </header>

    <main class="container">
      <p id="toast" class="alert toast" role="status" hidden></p>

      <div class="profile-grid">
        <!-- كارت الـ CV -->
        <div class="cv-card">
          <div class="cv-header-bg"></div>
          <div class="avatar-container">
            <img id="avatar-img" class="avatar-img" alt="صورة الملف الشخصي">
            <div id="avatar-placeholder" class="avatar-placeholder">م</div>
            <label for="avatar-upload" class="avatar-upload-btn" id="avatar-label" title="تغيير الصورة">📷</label>
            <input type="file" id="avatar-upload" accept="image/*" hidden>
          </div>
          <h2 id="p-name">جاري التحميل...</h2>
          <div id="p-role" class="role-badge">-</div>
          
          <div class="stats-row">
            <div class="stat-box"><div class="num" id="stat-cases">0</div><div class="lbl">قضايا نشطة</div></div>
            <div class="stat-box"><div class="num" id="stat-hearings">0</div><div class="lbl">جلسات قادمة</div></div>
            <div class="stat-box"><div class="num" id="stat-tasks">0</div><div class="lbl">مهام معلقة</div></div>
          </div>

          <div class="cv-info">
            <div><strong>اسم المستخدم</strong><span id="p-username" dir="ltr">-</span></div>
            <div><strong>البريد الإلكتروني</strong><span id="p-email" dir="ltr">-</span></div>
            <div><strong>رقم الهاتف</strong><span id="p-phone" dir="ltr">-</span></div>
            <div><strong>تاريخ الانضمام</strong><span id="p-date">-</span></div>
          </div>
        </div>

        <!-- التابات -->
        <div class="tabs-container">
          <div class="tabs-nav">
            <button class="tab-btn active" onclick="switchTab('tab-personal', this)">البيانات الشخصية</button>
            <button class="tab-btn" onclick="switchTab('tab-security', this)">الأمان</button>
            <button class="tab-btn" onclick="switchTab('tab-bio', this)">نبذة عني (Bio)</button>
          </div>

          <!-- 1. البيانات الشخصية -->
          <div id="tab-personal" class="tab-content active">
            <form id="profile-form">
              <div class="form-grid">
                <div class="field"><label>الاسم الكامل</label><input type="text" id="form-name" required></div>
                <div class="field"><label>رقم الهاتف</label><input type="tel" id="form-phone" dir="ltr"></div>
                <div class="field full-width" style="display: flex; justify-content: flex-end; margin-top: 1rem;">
                  <button type="submit" class="btn inline" id="save-profile-btn">حفظ التعديلات</button>
                </div>
              </div>
            </form>
          </div>

          <!-- 2. الأمان (باسورد + سؤال سري) -->
          <div id="tab-security" class="tab-content">
            <form id="password-form" style="margin-bottom: 2rem; border-bottom: 1px dashed var(--line); padding-bottom: 2rem;">
              <h3 style="margin-top:0; color: var(--indigo); font-size:1.1rem; margin-bottom:1rem;">تغيير كلمة المرور</h3>
              <div class="form-grid">
                <div class="field full-width"><label>كلمة المرور الجديدة (8 حروف على الأقل)</label><input type="password" id="form-new-pass" dir="ltr" required minlength="8"></div>
                <div class="field full-width" style="display: flex; justify-content: flex-end;">
                  <button type="submit" class="btn inline" id="save-pass-btn">تغيير الباسورد</button>
                </div>
              </div>
            </form>

            <form id="security-form">
              <h3 style="margin-top:0; color: var(--indigo); font-size:1.1rem; margin-bottom:1rem;">إعدادات استعادة الحساب</h3>
              <div class="form-grid">
                <div class="field"><label>السؤال السري</label><input type="text" id="form-q" placeholder="مثال: اسم مدرستك الأولى؟"></div>
                <div class="field"><label>الإجابة السرية</label><input type="text" id="form-a"></div>
                <div class="field full-width" style="display: flex; justify-content: flex-end; margin-top: 1rem;">
                  <button type="submit" class="btn inline" id="save-security-btn">حفظ السؤال السري</button>
                </div>
              </div>
            </form>
          </div>

          <!-- 3. النبذة -->
          <div id="tab-bio" class="tab-content">
            <div class="field">
              <label>اكتب نبذة عنك (تظهر في ملفك الشخصي كأنها CV)</label>
              <textarea id="p-bio" style="min-height: 150px; width: 100%; padding: 1rem; border: 1px solid var(--line); border-radius: 8px;"></textarea>
            </div>
            <div style="display: flex; justify-content: flex-end; margin-top: 1rem;">
              <button type="button" class="btn inline" onclick="document.getElementById('profile-form').requestSubmit()">حفظ النبذة</button>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/global-search.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/loader.js"></script>
   <script src="js/realtime-notifications.js"></script>
  <script src="js/profile.js"></script>
  
  <script>
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }
  </script>
</body>
</html>
