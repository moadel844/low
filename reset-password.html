<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تعيين كلمة مرور جديدة | المستشار</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=El+Messiri:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <main class="page-center">
    <section class="panel">
      <h1>كلمة مرور جديدة</h1>
      <p class="lead">اكتب كلمة المرور الجديدة لحسابك.</p>
      
      <form id="reset-form" novalidate>
        <div class="field">
          <label for="new-password">كلمة المرور الجديدة (8 حروف على الأقل)</label>
          <input id="new-password" type="password" dir="ltr" minlength="8" required>
        </div>
        <div class="field">
          <label for="confirm-password">تأكيد كلمة المرور</label>
          <input id="confirm-password" type="password" dir="ltr" minlength="8" required>
        </div>
        
        <p id="msg" class="alert" role="alert" hidden></p>
        <button id="reset-btn" type="submit" class="btn">حفظ كلمة المرور</button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.9"></script>
  <script src="js/supabase-client.js"></script>
  
  <script>
    const form = document.getElementById('reset-form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('reset-btn');
    
    function showError(text) { 
      msg.textContent = text; 
      msg.hidden = false; 
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault(); 
      msg.hidden = true;
      
      const p1 = document.getElementById('new-password').value;
      const p2 = document.getElementById('confirm-password').value;
      
      if (p1.length < 8) return showError('كلمة المرور لازم تكون 8 حروف على الأقل.');
      if (p1 !== p2) return showError('كلمتين المرور غير متطابقتين. تأكد منهم.');
      
      btn.disabled = true; 
      btn.textContent = 'جاري الحفظ...';
      
      try {
        // سوبابيز بتعرف تلقائياً إنك جاي من لينك الاستعادة
        const { error } = await sb.auth.updateUser({ password: p1 });
        
        if (error) { 
          showError('حدث خطأ: ' + error.message); 
        } else {
          msg.textContent = 'تم تغيير كلمة المرور بنجاح! جاري تحويلك لصفحة الدخول...';
          msg.className = 'alert ok';
          msg.hidden = false;
          setTimeout(() => {
            location.replace('login.html');
          }, 3000);
        }
      } catch (err) { 
        showError('مفيش اتصال بالخادم.'); 
      } finally { 
        btn.disabled = false; 
        btn.textContent = 'حفظ كلمة المرور'; 
      }
    });
  </script>
</body>
</html>
